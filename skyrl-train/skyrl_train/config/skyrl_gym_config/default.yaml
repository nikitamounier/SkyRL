# @package environment.skyrl_gym
# number of background workers for env step calls. Set to 0 to disable background workers.
max_env_workers: 32

text2sql:
  db_path: "/home/ray/default/sql_data"

llm_as_a_judge:
  model: "gpt-4o-mini"
  base_url: null  # or a local endpoint: http://localhost:8000/v1

search:
  log_requests: false
  search_url: "http://127.0.0.1:8000/retrieve"
  topk: 3
  timeout: 30

textworld:
  tokenizer_path: ""  # required; set to the base model path for tokenization
  max_turns: 50
  memory_window: 5
  max_memory_docs: 4
  max_doc_tokens: 256
  memory_modality_id: "memo_memory"
  # Declared here so they are overridable WITHOUT `+` (adding these as new keys
  # to this existing block via `+` did not land -> env kept Python defaults:
  # max_placeholder_tokens=8, pool_mode="standard").
  max_placeholder_tokens: 8        # MUST equal modalities.memo_memory num_memories
  placeholder_token: "<|image_pad|>"
  pool_mode: "standard"            # standard|adaptive|anchored|inverted|cosine_rag|rag_adaptive
  step_penalty: 0.0
  efficiency_bonus: 0.0
  # When false, the env never builds/injects memory documents or placeholder
  # tokens (no modality payload). Used by the ICL-LoRA baseline (no memory
  # module). Default true preserves the MeMo training behavior exactly.
  enable_memory: true
